<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ghost-infer</title>
<meta name="ghost-token" content="__GHOST_TOKEN__">
<style>
  @font-face { font-family: "Instrument Sans"; src: url("/vendor/instrument-sans-5.3.0.woff2") format("woff2"); font-weight: 400 700; font-style: normal; font-display: swap; }
  @font-face { font-family: "Instrument Sans"; src: url("/vendor/instrument-sans-italic-5.3.0.woff2") format("woff2"); font-weight: 400 700; font-style: italic; font-display: swap; }
  :root {
    --side: #10141f; --bg: #151a27; --raise: #1c2232; --raise-2: #232a3d; --line: rgba(233, 237, 247, 0.08); --line-2: rgba(233, 237, 247, 0.15);
    --text: #e8ebf3; --muted: #8e96ab; --faint: #646c82; --accent: #b9c7ff; --accent-ink: #121726; --accent-soft: rgba(185, 199, 255, 0.12); --danger: #ff9b8a;
    --code: #0f131d;
    --sans: "Instrument Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --mono: "Cascadia Code", "Cascadia Mono", Consolas, "SF Mono", ui-monospace, monospace;
    --column: min(760px, calc(100% - 48px));
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15.5px/1.65 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
  /* the layout lives in its own box: anything a browser extension adds to <body> stays out of its grid */
  .app { height: 100%; display: grid; grid-template-columns: 272px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { flex: none; }
  .ibtn { width: 34px; height: 34px; border: 0; border-radius: 9px; background: none; color: var(--muted); display: grid; place-items: center; }
  .ibtn:hover { background: var(--raise-2); color: var(--text); }

  /* ---- sidebar: brand, new chat, saved conversations, the model */
  aside { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 14px 18px; font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
  .brand svg { color: var(--text); }
  .brand .ibtn { margin-left: auto; display: none; }
  .new { margin: 0 12px 10px; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--raise); font-weight: 500; font-size: 14.5px; }
  .new:hover { background: var(--raise-2); }
  .chats { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
  .group { font-size: 12.5px; color: var(--faint); font-weight: 500; padding: 14px 10px 6px; }
  .chat { position: relative; display: flex; align-items: center; border-radius: 8px; }
  .chat button.open { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 7px 34px 7px 10px; font-size: 14px; color: var(--muted);
                      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 8px; }
  .chat:hover button.open { background: var(--raise); color: var(--text); }
  .chat.current button.open { background: var(--raise-2); color: var(--text); }
  .chat .del { position: absolute; right: 4px; width: 26px; height: 26px; border-radius: 6px; opacity: 0; }
  .chat:hover .del, .chat .del:focus-visible { opacity: 1; }
  .none { color: var(--faint); font-size: 13.5px; padding: 10px; }
  .machine { border-top: 1px solid var(--line); padding: 10px 8px; }
  .machine button { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: none; border-radius: 8px; padding: 8px 10px; font-size: 14px; color: var(--muted); text-align: left; }
  .machine button:hover, .machine button[aria-expanded="true"] { background: var(--raise); color: var(--text); }
  .tag { font: 11px/1 var(--mono); color: var(--muted); border: 1px solid var(--line-2); border-radius: 5px; padding: 3px 5px; white-space: nowrap; }

  /* ---- the conversation */
  .main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .top { flex: none; height: 52px; display: flex; align-items: center; gap: 6px; padding: 0 14px; }
  .top .ibtn { display: none; }
  .title { font-size: 14.5px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 6px; }
  .scroll { flex: 1; overflow-y: auto; scrollbar-gutter: stable both-edges; }
  .column { width: var(--column); margin: 0 auto; padding: 8px 0 200px; }
  .welcome { min-height: calc(100vh - 330px); display: flex; flex-direction: column; justify-content: center; padding-bottom: 40px; }
  .welcome h1 { font-size: 30px; line-height: 1.2; font-weight: 560; letter-spacing: -0.02em; margin: 0 0 8px; }
  .welcome p { color: var(--muted); margin: 0 0 22px; font-size: 16px; }
  .starters { display: flex; flex-wrap: wrap; gap: 8px; }
  .starters button { border: 1px solid var(--line-2); background: none; border-radius: 999px; padding: 7px 14px; font-size: 14px; color: var(--muted); }
  .starters button:hover { color: var(--text); background: var(--raise); }

  .msg { margin: 0 0 28px; overflow-wrap: anywhere; }
  .msg.user { display: flex; justify-content: flex-end; margin-bottom: 22px; }
  .msg.user .bubble { background: var(--raise-2); padding: 10px 16px; border-radius: 18px 18px 6px 18px; white-space: pre-wrap; max-width: 82%; }
  .answer > :first-child { margin-top: 0; }
  .answer > :last-child { margin-bottom: 0; }
  .answer p { margin: 0 0 14px; }
  .answer h1, .answer h2, .answer h3 { font-size: 17px; line-height: 1.35; font-weight: 600; letter-spacing: -0.01em; margin: 24px 0 8px; }
  .answer ul, .answer ol { margin: 4px 0 14px; padding-left: 22px; }
  .answer li { margin: 4px 0; }
  .answer li::marker { color: var(--muted); }
  .answer strong { font-weight: 600; }
  .answer hr { border: 0; border-top: 1px solid var(--line-2); margin: 20px 0; }
  .answer a { color: var(--accent); text-underline-offset: 2px; }
  .answer code { background: var(--raise-2); border-radius: 5px; padding: 1.5px 5px; font: 13.5px/1.5 var(--mono); font-variant-ligatures: none; } /* -> stays -> */
  .code { background: var(--code); border: 1px solid var(--line); border-radius: 12px; margin: 10px 0 16px; overflow: hidden; }
  .code-top { display: flex; align-items: center; justify-content: space-between; padding: 3px 6px 3px 14px; background: var(--raise); font-size: 12.5px; color: var(--muted); }
  .copy { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--muted); font-size: 12.5px; padding: 6px 8px; border-radius: 6px; }
  .copy:hover { color: var(--text); background: var(--raise-2); }
  .code pre { margin: 0; padding: 14px 16px; overflow-x: auto; }
  .code pre code { background: none; padding: 0; font: 13.5px/1.6 var(--mono); font-variant-ligatures: none; white-space: pre; overflow-wrap: normal; }
  .table { overflow-x: auto; margin: 10px 0 16px; border: 1px solid var(--line-2); border-radius: 10px; }
  .table table { border-collapse: collapse; font-size: 14.5px; width: 100%; }
  .table th, .table td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  .table tr:last-child td { border-bottom: 0; }
  .table th { font-weight: 600; background: var(--raise); }
  details.think { margin: 0 0 12px; }
  details.think summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
  details.think summary::-webkit-details-marker { display: none; }
  details.think summary::after { content: ""; width: 6px; height: 6px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); margin-left: 2px; transition: transform 0.15s; }
  details.think[open] summary::after { transform: rotate(45deg) translate(-2px, -1px); }
  details.think summary:hover { color: var(--text); }
  /* the agent tools: each call in the reply's tool note, and the approval card before a change */
  .toolnote .body { white-space: normal !important; }
  .toolnote .call { margin: 4px 0; }
  .toolnote .call summary { list-style: none; cursor: pointer; font-size: 13.5px; color: var(--muted); }
  .toolnote .call summary::-webkit-details-marker { display: none; }
  .toolnote .call summary:hover { color: var(--text); }
  .toolnote .call.denied summary { text-decoration: line-through; }
  .toolnote .call pre { margin: 6px 0 8px; padding: 8px 10px; border-radius: 8px; background: var(--code); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; }
  .approve { margin: 10px 0 14px; padding: 12px 14px; border-radius: 12px; background: var(--raise); border: 1px solid rgba(185, 199, 255, 0.35); font-size: 14px; }
  .approve .what { margin-bottom: 8px; }
  .approve pre { margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--code); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow: auto; }
  .approve .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .approve button { border: 1px solid var(--line-2); background: none; color: var(--text); border-radius: 8px; padding: 5px 12px; font-size: 13.5px; }
  .approve button.ok { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .undo { font-size: 12.5px; color: var(--muted); background: none; border: 1px solid var(--line-2); border-radius: 8px; padding: 3px 10px; margin-left: 6px; }
  .undo:hover { color: var(--text); }
  .toolgroups { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin: 10px 0 12px 26px; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--muted); font-size: 12.5px; text-decoration: underline; }
  details.think .body { white-space: pre-wrap; margin-top: 8px; padding-left: 14px; border-left: 2px solid var(--line-2); color: var(--muted); font-size: 14px; }
  .error { margin-top: 10px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border-radius: 10px; background: rgba(255, 155, 138, 0.08); border: 1px solid rgba(255, 155, 138, 0.25); color: var(--danger); font-size: 14.5px; }
  .error button { border: 1px solid rgba(255, 155, 138, 0.4); background: none; color: var(--danger); border-radius: 8px; padding: 4px 12px; font-size: 13.5px; }
  .actions { display: flex; align-items: center; gap: 2px; margin: 8px 0 0 -8px; opacity: 0; transition: opacity 0.15s; }
  .msg:hover .actions, .msg.last .actions, .actions:focus-within { opacity: 1; }
  .actions .ibtn { width: 30px; height: 30px; }
  .actions .stat { font-size: 12.5px; color: var(--faint); margin-left: 8px; font-variant-numeric: tabular-nums; }

  /* ---- the dock: the ghost sits on the message box; its canvas reaches below the box's top edge so the hem tucks behind it */
  .dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 24px 10px; pointer-events: none;
          background: linear-gradient(to bottom, rgba(21, 26, 39, 0), var(--bg) 34%); }
  .dock > * { width: var(--column); margin: 0 auto; }
  .perch { position: relative; height: 62px; }
  canvas#ghost { position: absolute; left: 0; bottom: -10px; width: 160px; height: 120px; display: block; }
  /* the pixel ghost: 24x22 pixels drawn three times over, with hard edges */
  canvas#pixelGhost { position: absolute; left: 10px; bottom: -3px; width: 72px; height: 66px; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  body[data-ghost="pixel"] canvas#ghost, body:not([data-ghost="pixel"]) canvas#pixelGhost { display: none; }
  .status { position: absolute; left: 92px; bottom: 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); white-space: nowrap; transition: opacity 0.2s; }
  .status i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .status.quiet { opacity: 0; }
  .status.error { color: var(--danger); }
  .status.error i { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  .speed { color: var(--text); font-variant-numeric: tabular-nums; }
  .composer { position: relative; pointer-events: auto; border-radius: 22px; background: var(--raise); border: 1px solid var(--line-2); box-shadow: 0 16px 40px -18px rgba(0, 0, 0, 0.8); }
  .composer:focus-within { border-color: rgba(185, 199, 255, 0.4); }
  .composer textarea { display: block; width: 100%; border: 0; outline: none; resize: none; background: transparent; min-height: 52px; max-height: 40vh; padding: 14px 18px 4px; line-height: 1.55; }
  .composer textarea::placeholder { color: var(--faint); }
  .tools { display: flex; align-items: center; gap: 8px; padding: 6px 8px 8px 10px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-2); background: none; border-radius: 999px; padding: 5px 12px 5px 9px; font-size: 13.5px; color: var(--muted); }
  .pill:hover { color: var(--text); }
  .pill[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); border-color: rgba(185, 199, 255, 0.3); }
  /* the model picker: which GGUF in the models folder answers; switching reloads the server's model */
  .picker { position: relative; min-width: 0; }
  .pill.model { max-width: 100%; color: var(--text); }
  .pill.model > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill.model.down { color: var(--danger); }
  .pill.model:disabled { cursor: default; color: var(--muted); }
  .models { position: absolute; left: 0; bottom: calc(100% + 8px); z-index: 4; width: min(380px, calc(100vw - 32px)); padding: 6px; border-radius: 14px;
            background: var(--raise-2); border: 1px solid var(--line-2); box-shadow: 0 24px 50px -20px rgba(0, 0, 0, 0.85); }
  .models p { margin: 4px 10px 8px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .models button { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto 18px; align-items: center; gap: 10px; border: 0; background: none; border-radius: 9px; padding: 8px 10px; text-align: left; }
  .models button:hover, .models button:focus-visible { background: var(--raise); }
  .models .mname { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .models .msize { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .models .mname .tag { margin-left: 8px; }
  .models svg { color: var(--accent); }
  .send { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
  .send:disabled { background: var(--raise-2); color: var(--faint); cursor: default; }
  .send.stop { background: var(--text); color: var(--accent-ink); }
  .note { text-align: center; font-size: 12px; color: var(--faint); padding-top: 8px; }

  /* ---- settings */
  .settings { position: fixed; left: 12px; bottom: 70px; z-index: 8; width: min(360px, calc(100vw - 24px)); max-height: calc(100vh - 90px); overflow-y: auto; padding: 18px; border-radius: 14px; display: none;
              background: var(--raise); border: 1px solid var(--line-2); box-shadow: 0 24px 50px -20px rgba(0, 0, 0, 0.8); }
  .settings.open { display: block; }
  .settings h2 { font-size: 15px; font-weight: 600; margin: 0 0 16px; }
  .field { display: grid; gap: 6px; margin-bottom: 16px; font-size: 14px; }
  .field .row { display: flex; justify-content: space-between; color: var(--muted); font-variant-numeric: tabular-nums; }
  .field .row span:first-child { color: var(--text); }
  .field input[type=range] { accent-color: var(--accent); width: 100%; }
  .field textarea { background: var(--bg); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px; resize: vertical; min-height: 64px; font-size: 14px; }
  .field small, .check small { color: var(--muted); font-size: 12.5px; line-height: 1.45; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
  .seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line-2); justify-self: start; }
  .seg button { border: 0; background: none; color: var(--muted); padding: 4px 14px; border-radius: 7px; font-size: 13.5px; }
  .seg button:hover { color: var(--text); }
  .seg button[aria-checked="true"] { background: var(--accent-soft); color: var(--accent); }
  .check input { accent-color: var(--accent); margin-top: 4px; }
  .scrim { display: none; }

  @media (max-width: 820px) {
    :root { --column: calc(100% - 28px); }
    .app { grid-template-columns: minmax(0, 1fr); }
    aside { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 7; transform: translateX(-100%); transition: transform 0.22s ease; }
    body.menu aside { transform: none; }
    body.menu .scrim { display: block; position: fixed; inset: 0; z-index: 6; background: rgba(5, 7, 12, 0.55); }
    .brand .ibtn, .top .ibtn { display: grid; }
    .top { padding: 0 8px; }
    .dock { padding: 0 0 8px; }
    .welcome h1 { font-size: 25px; }
    .note { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { aside, .actions, .status { transition: none; } }
</style>
<script type="importmap">{ "imports": { "three": "/vendor/three-0.160.0.module.min.js" } }</script>
</head>
<body>
<div class="app">
<aside id="side" aria-label="Conversations">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M4 19V10a7 7 0 0 1 14 0v9l-2.3-1.6L13.3 19 11 17.4 8.7 19l-2.4-1.6Z" fill="currentColor"/><ellipse cx="8.6" cy="10.5" rx="1.1" ry="1.5" fill="#10141f"/><ellipse cx="13.4" cy="10.5" rx="1.1" ry="1.5" fill="#10141f"/></svg>
    ghost-infer
    <button class="ibtn" id="closeMenu" aria-label="Close the menu"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
  </div>
  <button class="new" id="newBtn"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>New chat</button>
  <nav class="chats" id="chats" aria-label="Saved conversations"></nav>
  <div class="machine">
    <button type="button" id="settingsBtn" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h8M15 6h1M4 14h1M8 14h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="13.5" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="6.5" cy="14" r="2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
      Settings
    </button>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<section class="settings" id="settings" aria-label="Settings">
  <h2>Settings</h2>
  <div class="field"><span class="row"><span>Ghost</span></span>
    <div class="seg" id="ghostStyle" role="radiogroup" aria-label="Ghost style">
      <button type="button" role="radio" data-style="3d">3D</button><button type="button" role="radio" data-style="pixel">Pixel</button>
    </div>
    <small>Pixel needs no 3D graphics, so it is lighter on a slow computer.</small></div>
  <label class="field"><span class="row"><span>Temperature</span><span id="tempVal"></span></span><input type="range" id="temp" min="0" max="2" step="0.1" value="0.6"><small>0.6 suits most models. 0 always picks the likeliest word: the same answer every time, but thinking models can then repeat themselves without end.</small></label>
  <label class="field"><span class="row"><span>Longest reply</span><span id="maxVal"></span></span><input type="range" id="maxTokens" min="64" max="8192" step="64" value="2048"></label>
  <label class="field"><span class="row"><span>System prompt</span></span><textarea id="system" placeholder="Leave empty to use the model's default"></textarea></label>
  <label class="check"><input type="checkbox" id="moods" checked><span>Let the model set the ghost's mood<br><small>It starts replies with a hidden tag such as [happy]. Turn off for models that don't follow it.</small></span></label>
  <label class="check" id="speakRow" style="margin-top: 12px; display: none"><input type="checkbox" id="speak"><span>Speak replies aloud<br><small id="speakNote">Each sentence is read out as soon as it is written.</small></span></label>
  <label class="check" style="margin-top: 12px"><input type="checkbox" id="tools" checked><span>Let the model use tools<br><small>It asks you first before it changes a file, runs a command or goes online.</small></span></label>
  <div class="toolgroups">
    <label class="check"><input type="checkbox" id="tg_files" checked><span>Read files</span></label>
    <label class="check"><input type="checkbox" id="tg_edit" checked><span>Change files</span></label>
    <label class="check"><input type="checkbox" id="tg_cmd" checked><span>Run commands</span></label>
    <label class="check"><input type="checkbox" id="tg_web" checked><span>Search the web</span></label>
  </div>
  <label class="field"><span class="row"><span>Folders the model may use</span></span><textarea id="folders" placeholder="One folder per line, for example&#10;E:\Projects\notes"></textarea><small id="foldersNote">Files outside these folders are refused. Relative paths start in the first one.</small></label>
  <button type="button" class="linkbtn" id="resetAllow">Ask again before every change</button>
</section>

<div class="main">
  <div class="top">
    <button class="ibtn" id="menuBtn" aria-label="Show conversations"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
    <span class="title" id="title"></span>
  </div>
  <div class="scroll" id="scroll"><div class="column" id="log" role="log" aria-label="Conversation"></div></div>
  <div class="dock" id="dock">
    <div class="perch">
      <canvas id="ghost" aria-hidden="true"></canvas>
      <canvas id="pixelGhost" width="24" height="22" aria-hidden="true"></canvas>
      <span class="status quiet" id="status"><i></i><span id="statusText"></span><span class="speed" id="speed"></span></span>
    </div>
    <form class="composer" id="form">
      <textarea id="input" rows="1" placeholder="Ask anything, or paste code" aria-label="Message"></textarea>
      <div class="tools">
        <div class="picker">
          <button type="button" class="pill model" id="modelBtn" aria-haspopup="true" aria-expanded="false" title="Choose the model">
            <span id="modelName">Connecting…</span>
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5l3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="models" id="models" hidden></div>
        </div>
        <button type="button" class="pill" id="think" aria-pressed="true" title="Let the model reason before it answers: better on hard questions, slower to start">
          <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8a4.6 4.6 0 0 0-2.7 8.3c.5.4.8.9.8 1.5V12h3.8v-.4c0-.6.3-1.1.8-1.5A4.6 4.6 0 0 0 8 1.8ZM6.2 14.2h3.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Think
        </button>
        <button class="send" type="submit" id="sendBtn" aria-label="Send" disabled>
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" id="sendIcon"><path d="M9 14V4M4.5 8.5 9 4l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </form>

  </div>

</div>
<script type="module">
"use strict";
const $ = (id) => document.getElementById(id);

// ================================================================ the ghost
// A small 3D ghost drawn in code (three.js), sitting on the message box: every state is a set of pose targets the
// animation eases toward, so changes always blend. set(state), token() on each streamed token, rate(tok/s).
// Made only when the 3D style is chosen (three.js is not even loaded otherwise); null without WebGL.
async function make3d() {
  let THREE;
  try { THREE = await import("three"); } catch { return null; }
  const canvas = $("ghost");
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); } catch { return null; }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 3));
  const scene = new THREE.Scene();
  // framed so the ghost stands in the canvas's left part with its hem just above the box's edge, leaving room
  // above and to the right for raised arms, the magnifier and the z / ? / steam effects
  const camera = new THREE.PerspectiveCamera(32, 4 / 3, 0.1, 100);
  camera.position.set(2.0, 0.69, 10.5);
  scene.add(new THREE.HemisphereLight(0xf2f5ff, 0x3a4566, 1.7));
  const key = new THREE.DirectionalLight(0xffffff, 2.0);
  key.position.set(-3, 5, 6);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x9fb2ff, 1.2);
  rim.position.set(4, 2, -5);
  scene.add(rim);

  const root = new THREE.Group(); // floats and leans
  const body = new THREE.Group(); // squash and stretch
  root.add(body);
  scene.add(root);

  // body: a lathe dome with straight sides; the hem is waved per frame
  const R = 1.25, H = 1.55;
  const prof = [];
  for (let i = 0; i <= 24; i++) { const a = (i / 24) * Math.PI / 2; prof.push(new THREE.Vector2(Math.sin(a) * R + 1e-4, Math.cos(a) * R)); }
  for (let i = 1; i <= 12; i++) prof.push(new THREE.Vector2(R * (1 + 0.05 * i / 12), -H * (i / 12)));
  prof.reverse(); // hem to top: the lathe's faces then point outward
  const geo = new THREE.LatheGeometry(prof, 96);
  const base = geo.attributes.position.array.slice();
  // a soft self-glow keeps it ghostly white under the blue light; working states add to it
  const white = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.85, metalness: 0, emissive: 0xdfe5ff, emissiveIntensity: 0.12, transparent: true, opacity: 1 });
  const inner = new THREE.MeshStandardMaterial({ color: 0x8e99b8, roughness: 0.9, side: THREE.BackSide, transparent: true, opacity: 1 });
  body.add(new THREE.Mesh(geo, white), new THREE.Mesh(geo, inner));

  // face: eyes (oval, happy arc, closed line) with brows for angry / serious / worried faces, mouth, blush
  const dark = new THREE.MeshBasicMaterial({ color: 0x1a2030 });
  const shine = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const face = new THREE.Group();
  face.position.set(0, 0.28, 0);
  body.add(face);
  function makeEye(x) {
    const g = new THREE.Group();
    g.position.set(x, 0, R * 0.985);
    const oval = new THREE.Mesh(new THREE.SphereGeometry(0.15, 32, 16), dark);
    oval.scale.set(1, 1.42, 0.2);
    const hi = new THREE.Mesh(new THREE.CircleGeometry(0.042, 16), shine);
    hi.position.set(0.045, 0.07, 0.16);
    oval.add(hi);
    const arc = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.032, 10, 32, Math.PI), dark); // ^ shape
    arc.visible = false;
    const line = new THREE.Mesh(new THREE.CapsuleGeometry(0.03, 0.2, 4, 12), dark);
    line.rotation.z = Math.PI / 2;
    line.visible = false;
    const brow = new THREE.Mesh(new THREE.CapsuleGeometry(0.032, 0.2, 4, 12), dark);
    brow.rotation.z = Math.PI / 2;
    brow.position.set(0, 0.29, 0.02);
    brow.scale.setScalar(0.001);
    g.add(oval, arc, line, brow);
    return { g, oval, arc, line, brow, side: Math.sign(x) };
  }
  const eyes = [makeEye(-0.36), makeEye(0.36)];
  eyes.forEach((e) => face.add(e.g));
  const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.09, 24, 12), dark);
  mouth.position.set(0, -0.36, R * 1.0); // on the surface: the body is a little wider than R just below the dome
  mouth.scale.set(1, 0.05, 0.4);
  face.add(mouth);
  const blushMat = new THREE.MeshBasicMaterial({ color: 0xff9db5, transparent: true, opacity: 0, depthWrite: false });
  [-0.68, 0.68].forEach((x) => { const m = new THREE.Mesh(new THREE.CircleGeometry(0.13, 24), blushMat); m.position.set(x, -0.18, R * 0.9); m.rotation.y = x * 0.55; face.add(m); });

  // arms: small rounded nubs that slide out of the sides when there is something to do
  function makeArm(side) {
    const pivot = new THREE.Group();
    pivot.position.set(side * (R * 0.92), -0.45, 0.05);
    const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.15, 0.42, 6, 16), white);
    arm.position.set(side * 0.28, 0, 0);
    arm.rotation.z = side * Math.PI / 2;
    pivot.add(arm);
    pivot.scale.setScalar(0.001);
    body.add(pivot);
    return pivot;
  }
  const arms = [makeArm(-1), makeArm(1)];

  // a magnifying glass gripped by its handle at the tip of the right arm (the group's origin is the grip)
  const prop = new THREE.Group();
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.055, 0.46, 14), new THREE.MeshStandardMaterial({ color: 0x5a648a, roughness: 0.6 }));
  handle.position.set(0, 0.12, 0);
  const lens = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.05, 12, 36), new THREE.MeshStandardMaterial({ color: 0xb9c7ff, roughness: 0.3, metalness: 0.4 }));
  lens.position.set(0, 0.6, 0);
  const glass = new THREE.Mesh(new THREE.CircleGeometry(0.22, 32), new THREE.MeshStandardMaterial({ color: 0xd8e2ff, transparent: true, opacity: 0.35, depthWrite: false }));
  glass.position.copy(lens.position);
  prop.add(handle, lens, glass);
  prop.position.set(0.6, 0, 0.22);
  prop.scale.setScalar(0.001);
  arms[1].add(prop);

  // the small effects (z, ?, steam)
  function orbTexture(alpha) {
    const c = document.createElement("canvas"); c.width = c.height = 64; const x = c.getContext("2d"); const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, `rgba(255,255,255,${alpha})`); g.addColorStop(0.6, `rgba(220,228,255,${alpha / 3})`); g.addColorStop(1, "rgba(220,228,255,0)");
    x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
  }
  function glyph(text) {
    const c = document.createElement("canvas"); c.width = c.height = 128; const x = c.getContext("2d");
    x.font = "600 84px Bahnschrift, Segoe UI, sans-serif"; x.fillStyle = "#dfe6ff"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(text, 64, 70);
    return new THREE.CanvasTexture(c);
  }
  function drop() {
    const c = document.createElement("canvas"); c.width = c.height = 64; const x = c.getContext("2d");
    x.fillStyle = "#4f8dff"; x.strokeStyle = "#1d3f8f"; x.lineWidth = 4; x.beginPath(); x.moveTo(32, 6); x.bezierCurveTo(34, 24, 50, 34, 50, 44); x.arc(32, 44, 18, 0, Math.PI); x.bezierCurveTo(14, 34, 30, 24, 32, 6); x.fill(); x.stroke();
    return new THREE.CanvasTexture(c);
  }
  const fx = { z: glyph("z"), q: glyph("?"), ex: glyph("!"), puff: orbTexture(0.9), tear: drop() };
  const floaters = [];
  function emit(kind) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: fx[kind], transparent: true, depthWrite: false }));
    s.scale.setScalar(kind === "z" ? 0.6 : kind === "puff" ? 0.4 + Math.random() * 0.2 : kind === "tear" ? 0.28 : 0.85);
    const side = Math.random() < 0.5 ? -1 : 1;
    s.userData = { age: 0, vx: 0.15, vy: 0.45 }; // drift up and to the right
    if (kind === "puff") s.position.set(root.position.x + side * (0.35 + Math.random() * 0.25), root.position.y + 0.95, 0.3);
    else if (kind === "tear") { // from under one eye, falling
      s.position.set(root.position.x + side * 0.36 + face.position.x, root.position.y + 0.08, 1.35);
      s.userData = { age: 0, vx: 0, vy: -0.6 };
    } else s.position.set(root.position.x + 0.9 + Math.random() * 0.2, root.position.y + 1.2, 0.5);
    scene.add(s); floaters.push(s);
  }

  // brow: [shown 0..1, angle (+ = inner ends down, angry; - = inner ends up, worried), height]; front: an arm
  // brought round to the front (chin hand, crossed arms); bob: how much it floats; heat: white glow .. red;
  // mouthO: the mouth held open in an "o" (surprise), apart from talking
  const rest = { eye: "oval", eyeOpen: 1, lookX: 0, lookY: 0, lean: 0, tilt: 0, glow: 0, blush: 0, height: 0, arms: [0, 0], armLift: [0, 0], front: [0, 0],
                 prop: 0, hem: 1, opacity: 1, brow: [0, 0, 0], bob: 1, heat: 0, mouthO: 0 };
  const pose = (p) => ({ ...rest, ...p });
  const poses = {
    idle:      pose({}),
    listening: pose({ eyeOpen: 1.12, lookY: -0.6, lean: 0.16, glow: 0.05, height: -0.05 }),
    thinking:  pose({ eyeOpen: 0.55, lookX: 0.55, lookY: 0.65, lean: -0.04, tilt: 0.12, glow: 0.35, height: 0.08, arms: [0, 1], armLift: [0, 1.1], front: [0, 1], hem: 0.6 }),
    talking:   pose({ lean: 0.04, glow: 0.1, height: 0.05, hem: 1.4 }),
    cheerful:  pose({ lean: 0.04, glow: 0.12, blush: 0.4, height: 0.12, hem: 1.4 }), // talking, happily
    tool:      pose({ eyeOpen: 0.8, lookX: 0.75, lookY: 0.35, lean: 0.04, tilt: -0.06, glow: 0.25, height: 0.02, arms: [0.7, 1], armLift: [0.3, 0.75], front: [0, 0.35], prop: 1, hem: 1.2 }),
    happy:     pose({ eye: "arc", glow: 0.15, blush: 0.75, height: 0.3, arms: [1, 1], armLift: [1.0, 1.0], hem: 1.3 }),
    sorry:     pose({ eyeOpen: 0.6, lookY: -0.55, lean: 0.05, tilt: -0.08, height: -0.35, hem: 0.4, opacity: 0.85, brow: [1, -0.4, 0.02] }),
    surprised: pose({ eyeOpen: 1.45, lookY: 0.1, lean: -0.08, glow: 0.2, height: 0.25, arms: [1, 1], armLift: [0.9, 0.9], hem: 1.8, mouthO: 0.6 }),
    shocked:   pose({ eyeOpen: 1.75, lookY: 0.05, lean: -0.18, glow: 0.25, height: 0.38, arms: [1, 1], armLift: [1.1, 1.1], hem: 2.2, brow: [1, -0.1, 0.12], bob: 0.5, mouthO: 1 }), // jolts, see frame()
    excited:   pose({ eye: "arc", glow: 0.3, blush: 0.8, height: 0.35, arms: [1, 1], armLift: [0.95, 0.95], hem: 1.9, bob: 1.3 }), // bounces fast, arms waving
    curious:   pose({ eyeOpen: 1.25, lookX: 0.15, lookY: 0.15, lean: 0.14, tilt: 0.28, glow: 0.15, height: 0.05, arms: [0.7, 1], armLift: [0.3, 0.75], front: [0, 0.35], prop: 1, hem: 1.1, brow: [0.7, -0.12, 0.07] }),
    shy:       pose({ eye: "arc", eyeOpen: 0.9, lookX: -0.6, lookY: -0.45, lean: 0.08, tilt: -0.14, blush: 1, height: -0.12, arms: [1, 1], armLift: [0.1, 0.1], front: [1, 1], hem: 0.6, bob: 0.6 }),
    proud:     pose({ eyeOpen: 0.5, lookX: 0.25, lookY: 0.45, lean: -0.14, tilt: -0.04, glow: 0.2, blush: 0.2, height: 0.22, arms: [1, 1], armLift: [-0.15, -0.15], front: [0.45, 0.45], hem: 1, brow: [0.8, 0.1, 0.06] }),
    sad:       pose({ eyeOpen: 0.5, lookY: -0.75, lean: 0.06, tilt: 0.1, height: -0.42, hem: 0.25, opacity: 0.75, brow: [1, -0.6, 0], bob: 0.35 }), // a tear now and then
    angry:     pose({ eyeOpen: 0.62, lookY: -0.05, lean: 0.14, glow: 0.3, height: -0.08, arms: [1, 1], armLift: [-0.35, -0.35], hem: 0.55, brow: [1, 0.5, -0.07], bob: 0.35, heat: 1 }),
    serious:   pose({ eyeOpen: 0.78, lean: 0.03, height: -0.02, arms: [1, 1], armLift: [0.28, 0.28], front: [1, 1], hem: 0.5, brow: [1, 0.06, -0.05], bob: 0.2 }),
    confused:  pose({ eye: "squint", eyeOpen: 0.75, lookX: -0.3, lookY: 0.2, tilt: 0.22, arms: [0, 1], armLift: [0, 1.5], hem: 0.8, brow: [0.8, -0.25, 0.03] }),
    sleepy:    pose({ eye: "line", lookY: -0.2, lean: 0.02, tilt: 0.05, height: -0.45, hem: 0.3, opacity: 0.8, bob: 0.6 }), // sinks into the box
    wave:      pose({ eye: "arc", tilt: 0.06, glow: 0.1, blush: 0.4, height: 0.15, arms: [0, 1], armLift: [0, 0.95], hem: 1.2 }), // up and out, so the arm clears the body's outline
  };
  let state = "idle", target = poses.idle, setAt = 0;
  const cur = { ...rest, arms: [0, 0], armLift: [0, 0], front: [0, 0], brow: [0, 0, 0], talk: 0 };
  const coolGlow = new THREE.Color(0xdfe5ff), hotGlow = new THREE.Color(0xff6a5c);
  let rate = 0, lastTokenAt = -1, syllable = 0, openness = 0.7, mouthTarget = 0;
  let blinkAt = 2, blinkT = -1, glanceAt = 4, glance = [0, 0], fxTimer = 0;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const motion = reduced ? 0.3 : 1;

  // it looks toward the pointer: up at the conversation while you read, down at the box while you type
  const pointer = new THREE.Vector2();
  const clamp = (v) => Math.max(-1, Math.min(1, v));
  addEventListener("pointermove", (e) => {
    const r = canvas.getBoundingClientRect();
    pointer.set(clamp((e.clientX - (r.left + r.width / 4)) / 400), clamp(-(e.clientY - (r.top + r.height * 0.55)) / 300));
  });

  const ease = (a, b, k) => a + (b - a) * k;
  const clock = new THREE.Clock();
  function frame() {
    if (document.body.dataset.ghost !== "3d") { clock.getDelta(); requestAnimationFrame(frame); return; } // the pixel ghost is shown
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, k = 1 - Math.pow(0.0015, dt);
    for (const key of ["eyeOpen", "lookX", "lookY", "lean", "tilt", "glow", "blush", "height", "prop", "hem", "opacity", "bob", "heat", "mouthO"]) cur[key] = ease(cur[key], target[key], k);
    for (const key of ["arms", "armLift", "front", "brow"]) cur[key].forEach((v, i) => (cur[key][i] = ease(v, target[key][i], k)));
    const speaking = t - lastTokenAt < 0.35 && !["thinking", "tool", "sleepy"].includes(state);

    // float: livelier while speaking (only a little faster with speed)
    const energy = (speaking ? 1 + Math.min(rate, 60) / 200 : state === "sleepy" ? 0.4 : 1) * motion;
    // a small tremble when angry; a jolt that dies away when shocked
    const jolt = state === "shocked" ? Math.max(0, 1 - (t - setAt) / 0.6) * 0.05 : 0;
    root.position.x = (state === "angry" ? Math.sin(t * 38) * 0.012 : Math.sin(t * 50) * jolt) * motion;
    root.position.y = cur.height + Math.sin(t * 1.6 * energy) * 0.12 * cur.bob * motion + (state === "happy" ? Math.abs(Math.sin(t * 6)) * 0.12 * motion : 0) +
      (state === "excited" ? Math.abs(Math.sin(t * 9)) * 0.16 * motion : 0);
    root.rotation.x = cur.lean + pointer.y * -0.06;
    root.rotation.y = pointer.x * 0.25 + Math.sin(t * 0.7) * 0.04 * motion;
    root.rotation.z = cur.tilt + Math.sin(t * 1.1) * 0.025 * motion;
    const breathe = 1 + Math.sin(t * 1.6 * energy + 1) * 0.015;
    body.scale.set(1 / Math.sqrt(breathe), breathe, 1 / Math.sqrt(breathe));

    // the hem ripples
    const pos = geo.attributes.position;
    const amp = 0.11 * cur.hem, speed = 2.2 * (speaking ? 1 + Math.min(rate, 60) / 120 : 1) * Math.min(cur.hem, 1.3) * motion;
    for (let i = 0; i < pos.count; i++) {
      const y0 = base[3 * i + 1];
      if (y0 > -H * 0.45) continue;
      const x0 = base[3 * i], z0 = base[3 * i + 2], a = Math.atan2(z0, x0);
      const w = (-y0 - H * 0.45) / (H * 0.55);
      pos.array[3 * i + 1] = y0 + Math.sin(a * 6 + t * speed) * amp * w * w;
      const r = 1 + Math.sin(a * 6 + t * speed + 1.4) * 0.025 * w;
      pos.array[3 * i] = x0 * r; pos.array[3 * i + 2] = z0 * r;
    }
    pos.needsUpdate = true;

    white.emissiveIntensity = 0.12 + cur.glow * (0.75 + 0.25 * Math.sin(t * 3));
    white.emissive.copy(coolGlow).lerp(hotGlow, cur.heat);
    white.opacity = inner.opacity = cur.opacity;
    blushMat.opacity = cur.blush * 0.7;

    // eyes: state + pointer + idle glances; blinks
    if (t > glanceAt) { glance = [(Math.random() - 0.5) * 0.8, (Math.random() - 0.5) * 0.4]; glanceAt = t + 2.5 + Math.random() * 4; setTimeout(() => (glance = [0, 0]), 700); }
    const idle = state === "idle";
    const lx = cur.lookX + pointer.x * 0.35 + (idle ? glance[0] : 0), ly = cur.lookY + pointer.y * 0.25 + (idle ? glance[1] : 0);
    face.position.x = ease(face.position.x, lx * 0.14, k);
    face.position.y = ease(face.position.y, 0.28 + ly * 0.1, k);
    if (t > blinkAt && blinkT < 0) blinkT = 0;
    let lid = 1;
    if (blinkT >= 0) { blinkT += dt; lid = Math.abs(Math.cos(Math.min(blinkT / 0.16, 1) * Math.PI)); if (blinkT > 0.16) { blinkT = -1; blinkAt = t + 2.5 + Math.random() * 4; } }
    eyes.forEach((e, i) => {
      const shape = target.eye;
      e.oval.visible = shape === "oval" || shape === "squint";
      e.arc.visible = shape === "arc";
      e.line.visible = shape === "line";
      const open = cur.eyeOpen * lid * (shape === "squint" && i === 0 ? 0.35 : 1);
      e.oval.scale.set(0.9 + 0.1 * cur.eyeOpen, 1.42 * Math.max(open, 0.06), 0.2);
      const [shown, angle, by] = cur.brow;
      e.brow.scale.setScalar(Math.max(shown, 0.001));
      e.brow.rotation.z = Math.PI / 2 + e.side * angle;
      e.brow.position.y = 0.27 + by - (1 - cur.eyeOpen) * 0.08;
    });

    // mouth: a speaking rhythm of its own (about 4.5 syllables a second) while tokens keep arriving
    if (speaking) {
      syllable += dt * 4.5 * (0.92 + Math.min(rate, 60) / 400);
      if (syllable >= 1) { syllable -= 1; openness = 0.45 + Math.random() * 0.55; }
      mouthTarget = openness * Math.pow(Math.sin(syllable * Math.PI), 0.8);
    } else mouthTarget = 0;
    cur.talk = ease(cur.talk, mouthTarget, 1 - Math.pow(0.0001, dt));
    // the mouth talks, or stays open in an "o" (surprised, shocked), whichever is wider
    const open = Math.max(cur.talk, cur.mouthO);
    mouth.scale.set(cur.mouthO > cur.talk ? 0.75 + 0.1 * cur.mouthO : 1 + cur.talk * 0.2, 0.05 + open * 0.75, 0.4);
    mouth.visible = open > 0.03;

    // arms: out (scale), raised (rotation), or round to the front
    arms.forEach((a, i) => {
      const side = i ? 1 : -1;
      a.scale.setScalar(Math.max(cur.arms[i], 0.001));
      let raise = cur.armLift[i];
      if (state === "wave" && i === 1) raise += Math.sin(t * 9) * 0.35 * motion;
      if (state === "excited") raise += Math.sin(t * 12 + i * Math.PI) * 0.3 * motion;
      if (speaking) raise += Math.max(0, Math.sin(t * 1.3 + i * 2)) * 0.18 * Math.min(1, cur.talk * 2);
      a.rotation.z = side * raise;
      const f = cur.front[i], cross = state === "serious" ? f : 0;
      a.rotation.y = side * -(1.25 + 1.1 * cross) * f;
      a.position.x = side * R * (0.92 - 0.37 * f - 0.25 * cross);
      a.position.z = 0.05 + (R * 0.95 + (i ? 0.09 : 0)) * f;
      a.position.y = -0.45 - 0.1 * f - (i ? 0.02 : 0.08) * cross;
    });
    prop.scale.setScalar(Math.max(cur.prop, 0.001));
    prop.rotation.z = -arms[1].rotation.z - 0.25 + Math.sin(t * 2) * 0.06 * motion;
    prop.rotation.y = -arms[1].rotation.y - 0.3;

    if (state === "sleepy" && (fxTimer -= dt) < 0) { emit("z"); fxTimer = 1.6; }
    if (state === "angry" && (fxTimer -= dt) < 0) { emit("puff"); fxTimer = 0.35; }
    if (state === "sad" && (fxTimer -= dt) < 0) { emit("tear"); fxTimer = 2.4; }
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i]; f.userData.age += dt; f.position.y += dt * f.userData.vy; f.position.x += dt * f.userData.vx; f.material.opacity = Math.max(0, 1 - f.userData.age / 2.4);
      if (f.userData.age > 2.4) { scene.remove(f); f.material.dispose(); floaters.splice(i, 1); }
    }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  new ResizeObserver(() => {
    if (!canvas.clientWidth) return; // hidden
    renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
    camera.aspect = canvas.clientWidth / canvas.clientHeight;
    camera.updateProjectionMatrix();
  }).observe(canvas);
  frame();
  return {
    get state() { return state; },
    set(s) {
      if (!poses[s] || s === state) return;
      state = s; target = poses[s]; setAt = clock.elapsedTime; fxTimer = 0.8;
      if (s === "confused") emit("q");
      if (s === "shocked") emit("ex");
    },
    token() { lastTokenAt = clock.elapsedTime; },
    rate(r) { rate = r; },
  };
}

// ================================================================ the pixel ghost
// The same ghost as pixel art on a 2D canvas, with the same moods and the same set / token / rate. A hand-drawn
// 14x14 body on a 24x22 canvas, leaving room above and to the right for signs and props; it moves in steps a few
// times a second, like an old game sprite.
function makePixel(canvas) {
  const ctx = canvas.getContext("2d");
  const W = 24, H = 22, OX = 3, OY = 6;
  const PAL = { o: "#0b0e17", w: "#e8ebf3", s: "#aeb6cc", h: "#ffffff", e: "#121726", b: "#ff9db5", a: "#b9c7ff", A: "#7f8cc4", t: "#8fc0ff", y: "#ffc98a", p: "#8e96ab" };
  const TOP = ["....wwwwww....", "..wwwwwwwwww..", ".wwwwwwwwwwww.", ".wwwwwwwwwwww.", ...Array(8).fill("wwwwwwwwwwwwww")];
  const HEM = [["wwww..wwww..ww", ".ww....ww....w"], ["ww..wwww..wwww", "w....ww....ww."]]; // two frames: it wiggles
  const bodies = HEM.map((hem) => [...TOP, ...hem].map((r) => [...r].map((ch) => ch === "w")));
  const SIGN = { // little pictures above its head, row by row
    "!": ["y", "y", "y", ".", "y"],
    "?": [".yy.", "y..y", "..y.", "....", "..y."],
    z: ["aaa", "..a", ".a.", "aaa"],
  };
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pointer = { x: 0, y: 0 };
  addEventListener("pointermove", (e) => {
    const r = canvas.getBoundingClientRect();
    pointer.x = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / 300));
    pointer.y = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height / 2)) / 200));
  });
  let state = "idle", setAt = 0, lastTokenAt = -1e9, blinkAt = 2500, glanceAt = 5000, glance = 0;

  function paint(now) {
    const since = now - setAt;
    const step = Math.floor(now / (reduced ? 900 : 420)); // the sprite's clock
    const speaking = now - lastTokenAt < 350 && !["thinking", "tool", "sleepy"].includes(state);
    const syllable = speaking && Math.floor(now / 110) % 2; // mouth open, about 4.5 times a second
    const g = Array.from({ length: H }, () => Array(W).fill(null));
    const put = (x, y, c) => { if (x >= 0 && y >= 0 && x < W && y < H) g[y][x] = c; };

    // where the body sits: a one-pixel bob; sinking when low, hopping when glad, shaking when shocked or angry
    let dx = 0, dy = Math.floor(now / (state === "sleepy" ? 1100 : 420)) % 2;
    if (["sleepy", "sad"].includes(state)) dy += 2;
    if (["sorry", "shy"].includes(state)) dy += 1;
    if (state === "proud") dy -= 1;
    if (!reduced) {
      if (state === "happy" || state === "wave") dy -= [0, 1, 2, 1][Math.floor(now / 200) % 4];
      if (state === "excited") dy -= [0, 1, 2, 1][Math.floor(now / 120) % 4];
      if ((state === "shocked" && since < 600) || (state === "angry" && Math.floor(now / 70) % 6 < 2)) dx = Math.floor(now / 50) % 2 ? 1 : -1;
    }
    const B = (x, y, c) => put(OX + dx + x, OY + dy + y, c); // in body coordinates
    const sign = (k, x, y) => SIGN[k].forEach((row, j) => [...row].forEach((c, i) => c !== "." && put(OX + x + i, OY + dy + y + j, c)));

    // body, shaded on its right and bottom edges, with a shine
    const m = bodies[step % 2];
    for (let y = 0; y < m.length; y++) for (let x = 0; x < 14; x++) if (m[y][x]) {
      const edge = !m[y][x + 1] || !(m[y + 1] && m[y + 1][x]);
      B(x, y, edge ? "s" : "w");
    }
    B(3, 1, "h"); B(2, 2, "h");

    // where it looks: at the pointer when idle or listening, with a glance now and then
    if (now > glanceAt) { glance = glance ? 0 : Math.random() < 0.5 ? -1 : 1; glanceAt = now + (glance ? 900 : 4000 + Math.random() * 4000); }
    const follow = ["idle", "listening"].includes(state);
    const lx = follow ? (glance || Math.round(pointer.x)) : 0;
    const eye = (x, y, h = 2, shine = true) => {
      for (let i = 0; i < h; i++) { B(x, y + i, "e"); B(x + 1, y + i, "e"); }
      if (shine) B(x + (lx > 0 ? 1 : 0), y, "h");
    };
    const eyes = (y = 4, h = 2, shine = true, look = lx) => { eye(3 + look, y, h, shine); eye(9 + look, y, h, shine); };
    const px = (list, c = "e") => list.forEach(([x, y]) => B(x, y, c));
    const arcs = (look = 0) => px([[2 + look, 5], [3 + look, 4], [4 + look, 5], [8 + look, 5], [9 + look, 4], [10 + look, 5]]);
    const lines = (y = 5) => px([[3, y], [4, y], [9, y], [10, y]]);
    const blush = (wide = false) => { px([[1, 7], [12, 7]], "b"); if (wide) px([[2, 7], [11, 7]], "b"); };
    const smile = () => px([[5, 7], [6, 8], [7, 8], [8, 7]]);
    const talk = () => { px([[6, 8], [7, 8]]); if (syllable) px([[6, 9], [7, 9]]); };
    const magnifier = () => { px([[15, 3], [16, 2], [17, 2], [18, 3], [18, 4], [17, 5], [16, 5], [15, 4]], "a"); if (step % 3) B(16, 3, "h"); px([[14, 6], [13, 7]], "A"); };
    if (now > blinkAt + 140) blinkAt = now + 2500 + Math.random() * 3500;
    const blinking = now > blinkAt && ["idle", "listening", "talking", "tool", "curious", "serious", "surprised"].includes(state);

    switch (state) {
      case "listening": blinking ? lines(6) : eyes(5); break; // looking down at the box
      case "thinking":
        eyes(3, 2, false, 1);
        for (let i = 0; i < 3; i++) if (step % 4 > i) put(OX + 13 + i * 2, OY + dy - 2, "a");
        break;
      case "talking": blinking ? lines() : eyes(); talk(); break;
      case "cheerful": arcs(); blush(); syllable ? px([[5, 7], [6, 8], [7, 8], [8, 7], [6, 9], [7, 9]]) : smile(); break;
      case "tool": blinking ? lines() : eyes(4, 2, false, 1); magnifier(); break;
      case "curious":
        eye(4, 4, 2, false); eye(10, 3, 3, false); px([[10, 1], [11, 1]]);
        magnifier();
        break;
      case "happy": arcs(); blush(); smile(); break;
      case "excited":
        arcs(); blush(); px([[5, 7], [6, 8], [7, 8], [8, 7], [6, 7], [7, 7]]);
        [[15, -1], [17, 2], [-2, 1], [16, 6], [-1, 6]].forEach(([x, y], i) => (step + i) % 3 === 0 && put(OX + dx + x, OY + dy + y, "y"));
        break;
      case "surprised": blinking ? lines() : eyes(3, 3); px([[6, 9], [7, 9]]); break;
      case "shocked":
        eyes(3, 3); px([[6, 8], [7, 8], [6, 9], [7, 9]]);
        if (since < 2500) sign("!", 16, -5);
        break;
      case "sorry": lines(); px([[3, 3], [4, 2], [9, 2], [10, 3], [6, 9], [7, 9]]); break;
      case "sad":
        lines(); px([[3, 3], [4, 2], [9, 2], [10, 3], [5, 9], [6, 8], [7, 8], [8, 9]]);
        B(3, 6 + (step % 4), "t");
        break;
      case "shy": arcs(-1); blush(true); px([[6, 9]]); break;
      case "proud": px([[3, 3], [4, 3], [9, 3], [10, 3]]); lines(5); smile(); blush(); break;
      case "angry":
        px([[3, 2], [4, 3], [9, 3], [10, 2], [3, 4], [4, 4], [9, 4], [10, 4], [5, 9], [6, 8], [7, 8], [8, 9]]);
        if (step % 2) { put(OX + dx + 1, OY + dy - 2, "p"); put(OX + dx + 2, OY + dy - 3, "p"); } else { put(OX + dx + 12, OY + dy - 2, "p"); put(OX + dx + 11, OY + dy - 3, "p"); }
        break;
      case "serious": px([[3, 3], [4, 3], [9, 3], [10, 3]]); blinking ? lines() : eyes(4, 2, false); px([[5, 8], [6, 8], [7, 8], [8, 8]]); break;
      case "confused":
        px([[3, 5], [4, 5], [9, 2], [10, 2]]); eye(9, 4, 2, false); px([[5, 9], [6, 8], [7, 9], [8, 8]]);
        if (since < 3000 || step % 4 < 2) sign("?", 15, -5);
        break;
      case "sleepy": lines(); if (step % 6 < 4) sign("z", 15, step % 6 > 1 ? -4 : -3); break;
      case "wave":
        arcs(); blush(); smile();
        px(Math.floor(now / 180) % 2 ? [[14, 6], [15, 5], [16, 4], [16, 3]] : [[14, 6], [15, 5], [16, 5], [17, 4]], "w");
        break;
      default: blinking ? lines() : eyes(); // idle
    }

    // outline: every empty pixel touching the ghost (body, face or arm), not the props and signs
    const solid = (x, y) => g[y] && ["w", "s", "h", "b", "e"].includes(g[y][x]);
    const edge = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
      if (!g[y][x] && (solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1))) edge.push([x, y]);
    edge.forEach(([x, y]) => (g[y][x] = "o"));

    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = ["sad", "sleepy"].includes(state) ? 0.8 : state === "sorry" ? 0.9 : 1;
    const pal = state === "angry" ? { ...PAL, s: "#f0a196" } : PAL;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (g[y][x]) { ctx.fillStyle = pal[g[y][x]]; ctx.fillRect(x, y, 1, 1); }
  }
  // repaint at most 20 times a second, and only while the pixel ghost is the one shown
  let last = -1;
  function frame(now) {
    if (document.body.dataset.ghost === "pixel" && now - last > 50) { last = now; paint(now); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  return {
    get state() { return state; },
    set(s) { if (s !== state) { state = s; setAt = performance.now(); } },
    token() { lastTokenAt = performance.now(); },
    rate() {},
  };
}

let chat = chats.find((c) => c.id === store.get("current", null)) || chats[0] || blank(); // a new chat joins the list when it gets its first message
let busy = null; // AbortController of the running request

const ICON = {

// ---- the ghost's status line: quiet unless something is happening
const LABELS = { thinking: "Thinking", talking: "Writing", cheerful: "Writing", tool: "Using a tool", wave: "Hello" };
function mood(s, label, error = false) {
  ghost?.set(s);
  const text = label ?? LABELS[s] ?? "";
  $("statusText").textContent = text;
  $("status").classList.toggle("quiet", !text);
  $("status").classList.toggle("error", error);
}
// after a reply or an error: hold the face a moment, then rest
function settleTo(s, ms, label, error = false) {
  clearTimeout(settle);
  mood(s, label, error);
  settle = setTimeout(() => { if (!busy) mood($("input").value.trim() ? "listening" : "idle"); }, ms);
}
// nobody around for two minutes: doze off; any activity wakes it
setInterval(() => { if (!busy && ghost?.state === "idle" && performance.now() - lastActive > 120000) mood("sleepy"); }, 5000);
for (const ev of ["pointermove", "keydown", "pointerdown", "wheel"]) addEventListener(ev, () => { lastActive = performance.now(); if (ghost?.state === "sleepy") mood("idle"); });

// ---- settings, kept in this browser

}

// ---- the ghost's style: 3D or pixel, kept in this browser; both get every mood, only the chosen one is drawn

// ---- the sidebar
const menu = (on) => document.body.classList.toggle("menu", on);
$("menuBtn").onclick = () => menu(true);
$("closeMenu").onclick = $("scrim").onclick = () => menu(false);
addEventListener("keydown", (e) => { if (e.key === "Escape") { openSettings(false); menu(false); closeModels(); } });

function renderChats() {
  const nav = $("chats");
  nav.innerHTML = "";
  if (!chats.length) { nav.innerHTML = '<p class="none">Your conversations will show up here.</p>'; return; }
  const today = new Date().setHours(0, 0, 0, 0), day = 86400000;
  const groupOf = (at) => at >= today ? "Today" : at >= today - day ? "Yesterday" : at >= today - 7 * day ? "Previous 7 days" : "Older";
  let group = null;
  for (const c of [...chats].sort((a, b) => b.at - a.at)) {
    if (groupOf(c.at) !== group) {
      group = groupOf(c.at);
      const h = document.createElement("div");
      h.className = "group"; h.textContent = group;
      nav.appendChild(h);
    }
    const row = document.createElement("div");
    row.className = "chat" + (c === chat ? " current" : "");
    const open = document.createElement("button");
    open.className = "open"; open.textContent = open.title = c.title || "New chat";
    if (c === chat) open.setAttribute("aria-current", "true");
    open.onclick = () => switchTo(c);
    const del = document.createElement("button");
    del.className = "ibtn del"; del.innerHTML = ICON.trash; del.title = "Delete"; del.setAttribute("aria-label", `Delete ${c.title || "this chat"}`);
    del.onclick = () => remove(c);
    row.append(open, del);
    nav.appendChild(row);
  }
}
function switchTo(c) {
  if (busy) busy.abort();
  speaker.stop();
  chat = c;
  save(); renderChats(); renderAll(); menu(false);
  $("input").focus();
}
function remove(c) {
  if (!confirm(`Delete "${c.title || "this chat"}"? This can't be undone.`)) return;
  chats = chats.filter((x) => x !== c);
  if (c === chat) { if (busy) busy.abort(); chat = blank(); renderAll(); }
  save(); renderChats();
}

  if (!chat.messages.length) { menu(false); $("input").focus(); return; }
  switchTo(blank());

// ---- the model picker: the GGUF files in the server's models folder; choosing one makes the server switch to it.
// Models are named the way people say them: "JOSIEFIED-Qwen3-8B-Q4_K_M" is JOSIEFIED Qwen3 8B, quantized Q4_K_M.
const pretty = (id) => {
  const m = id.match(/^(.*?)[-_.]((?:I?Q\d\w*)|F16|BF16|F32)$/i);
  return { name: (m ? m[1] : id).replace(/[-_]+/g, " "), quant: m ? m[2].toUpperCase() : "" };
};
const size = (n) => n >= 1e9 ? (n / 1e9).toFixed(1) + " GB" : Math.round(n / 1e6) + " MB";
let model = null, loadingModel = null; // the server's model, and the one it is switching to
let canThink = true; // the model has a thinking switch (Qwen3, GLM); others never think, so Think is hidden
let noThinkTag = true; // the model also reads "/no_think" in a message (Qwen3)
let about = null; // what the model is, read from its file by the server
let speechModel = null; // the server's speech model (--tts), if it has one

async function setVoice(on) {
  if (!speechModel || !model || on === voiceOn) return;
  $("speakNote").textContent = on ? "Loading the voice…" : "Unloading the voice…";
  try {
    await fetch("/api/models/load", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: model, voice: on }) });
  } catch {}
  await refreshModels();

// ---- spoken replies: finished sentences go to the speech model one after another (/v1/audio/speech),
// come back as 16-bit samples while they are made, and play back to back. A chat's id is the speech's
// conversation, so the voice carries on from the sentences before.
const speaker = {
  ctx: null, at: 0, queue: [], running: false, ctrl: null, gen: 0, sources: [],
  // on a click (browsers start audio only after one)
  unlock() { this.ctx ||= new AudioContext(); this.ctx.resume(); },
  say(text, conversation) { this.queue.push({ text, conversation }); this.run(); },
  stop() {
    this.gen++; this.queue = []; this.ctrl?.abort();
    for (const s of this.sources) try { s.stop(); } catch {}
    this.sources = []; this.at = 0;
  },
  async run() {
    if (this.running) return;
    this.running = true;
    const gen = this.gen;
    try {
      while (this.queue.length && gen === this.gen) {

      const nl = part.indexOf("\n");
      const lang = (nl >= 0 ? part.slice(0, nl) : part).trim();
      const code = nl >= 0 ? part.slice(nl + 1).replace(/\n$/, "") : "";
      out.push(`<div class="code"><div class="code-top"><span>${esc(lang || "code")}</span><button class="copy" type="button">${ICON.copy}<span>Copy</span></button></div><pre><code>${esc(code)}</code></pre></div>`);
      return;
    }
    let list = null, para = [];
    const close = () => { if (list) { out.push("</" + list + ">"); list = null; } };
    const flush = () => { if (para.length) { out.push("<p>" + inline(para.join("\n")).replace(/\n/g, "<br>") + "</p>"); para = []; } };
    const lines = part.split("\n");
    for (let i = 0; i < lines.length; i++) {

      if ((m = line.match(/^(#{1,6})\s+(.*)/))) { flush(); close(); const h = Math.min(m[1].length, 3); out.push(`<h${h}>${inline(m[2])}</h${h}>`); continue; }

      if (line.includes("|") && TABLE_RULE.test(lines[i + 1] || "")) {

        for (i += 2; i < lines.length && lines[i].includes("|") && lines[i].trim(); i++) html += "<tr>" + cells(lines[i]).map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>";
        i--;

        continue;
      }
      if ((m = line.match(/^\s*([-*•]|\d+[.)])\s+(.*)/))) {
        flush();

        if (list !== kind) { close(); out.push("<" + kind + ">"); list = kind; }

      btns.append(b);
    }
    box.append(btns);
    el.querySelector(".actions").before(box);
    box.scrollIntoView({ block: "nearest", behavior: "smooth" });
    busy?.signal.addEventListener("abort", () => done("deny"), { once: true });
  });
}

async function runTool(name, argsText, checkpoint) {
  try {
    if (name === "get_system_info") return JSON.stringify(await (await fetch("/api/system")).json(), null, 1);
    const j = await harness("/api/tools/run", { name, arguments: argsText || "{}", checkpoint });
    return j.error ? `Error: ${j.error}` : j.result;
  } catch (e) {
    return `Error: ${e.message || e}`;
  }
}

// the allowed folders, kept by the server; the textarea saves them when it loses focus
let folders = [];
async function loadHarness() {
  try {
    folders = (await harness("/api/harness")).folders || [];
    $("folders").value = folders.join("\n");
  } catch (e) {
    $("foldersNote").textContent = `Tools are unavailable: ${e.message || e}`;
  }
}
$("folders").addEventListener("change", async () => {
  try {
    folders = (await harness("/api/harness", { folders: $("folders").value.split("\n").map((f) => f.trim()).filter(Boolean) })).folders;
    $("foldersNote").textContent = folders.length ? `Saved. Relative paths start in ${folders[0]}.` : "Saved: no folders, so file tools are refused.";
  } catch (e) {
    $("foldersNote").textContent = String(e.message || e);
  }
});
loadHarness();
// told to the model when tools are on: where it may work, and how this computer runs commands
function toolPrompt() {
  const where = folders.length ? `You may use files in ${folders.join(", ")} (relative paths start in ${folders[0]}).` : "No folders are allowed yet, so file tools will fail; if you need files, ask the user to add a folder in Settings.";
  return `You can use tools to do things on the user's computer. ${where} It runs Windows; commands run in Windows PowerShell. Read a file before you edit it. Use tools until the task is done, then answer briefly.`;
}
// a reply that used tools, as the messages the model wrote and read: each round's call and the results, then the answer
function expand(m) {
  const out = [];
  for (const st of m.steps || []) {
    out.push({ role: "assistant", content: st.sent, tool_calls: st.calls.map((cl) => ({ id: cl.id, type: "function", function: { name: cl.name, arguments: cl.arguments } })) });
    for (const cl of st.calls) out.push({ role: "tool", tool_call_id: cl.id, content: cl.result });
  }
  return out;
}

// ---- moods: the model starts its reply (or a sentence) with a hidden tag
const MOOD_TAGS = ["happy", "excited", "neutral", "curious", "serious", "proud", "surprised", "shocked", "confused", "shy", "sorry", "sad", "angry"];
const MOOD_PROMPT = "You appear to the user as a small ghost whose face follows your mood. Start every reply with one mood tag in square brackets, one of: " +
  MOOD_TAGS.map((t) => `[${t}]`).join(", ") + ". Use only these tags. You may put another tag before a sentence where your mood changes. " +
  "The tags are hidden from the user; never mention them.";
// tags models make up anyway, as the nearest mood
const MOOD_SYNONYMS = {
  joyful: "happy", glad: "happy", cheerful: "happy", delighted: "happy", playful: "happy", laughing: "happy", grateful: "happy", friendly: "happy",
  thrilled: "excited", enthusiastic: "excited", eager: "excited", energetic: "excited", amazed: "surprised", astonished: "surprised", impressed: "surprised",
  awed: "surprised", awestruck: "surprised", wonder: "surprised", wowed: "surprised", fascinated: "curious", intrigued: "curious", inquisitive: "curious",
  stunned: "shocked", horrified: "shocked", startled: "shocked", calm: "neutral", relaxed: "neutral", content: "neutral", helpful: "neutral",
  thinking: "curious", thoughtful: "curious", pondering: "curious", interested: "curious", focused: "serious", determined: "serious",
  confident: "proud", smug: "proud", puzzled: "confused", unsure: "confused", uncertain: "confused", embarrassed: "shy", blushing: "shy",
  nervous: "shy", apologetic: "sorry", worried: "sorry", anxious: "sorry", unhappy: "sad", disappointed: "sad", upset: "sad",
  annoyed: "angry", frustrated: "angry", mad: "angry", grumpy: "angry",
};
// [word] as a whole word, not a link's text ([text](url)) and not part of an expression (a[i])
const TAG_RE = /(^|[\s(*_])\[([A-Za-z]{3,14})\](?!\()[ \t]*/g;
// the shown text without its tags (and without a tag still being typed at the very end), and the latest mood.
// A listed mood or a known synonym is a tag anywhere; another lower-case word only where a tag would go:
// at the start of the reply, a line or a sentence.
function moodOf(answer, streaming) {
  let last = null;
  let shown = answer.replace(TAG_RE, (all, before, word, at) => {
    const w = word.toLowerCase(), mood = MOOD_TAGS.includes(w) ? w : MOOD_SYNONYMS[w];
    const tagSpot = /(^|\n|[.!?…:]\s)\s*$/.test(answer.slice(0, at) + before);
    if (!mood && !(tagSpot && word === w)) return all;
    if (mood) last = mood;
    return before;
  });
  if (streaming || /\[[a-z]{0,14}$/i.test(shown.trim())) shown = shown.replace(/\[[a-z]{0,14}\s*$/i, ""); // a tag cut off at the end
  return { shown: shown.replace(/^\s+/, ""), last };
}
// the face while a reply in that mood streams, and the one it holds afterwards
const TALKING_FACE = { happy: "cheerful", neutral: "talking" };
const AFTER_FACE = { neutral: "happy" };
const talkingFace = (m) => TALKING_FACE[m] || m || "talking";
const afterFace = (m) => AFTER_FACE[m] || m || "happy";

// splits the raw reply into its <think> part and the answer
function split(raw, m, t0) {
  const open = raw.indexOf("<think>");
  if (open < 0 || raw.slice(0, open).trim()) { m.answer = raw; return; }
  const close = raw.indexOf("</think>");
  if (close < 0) { m.think = raw.slice(open + 7); m.answer = ""; return; }
  m.think = raw.slice(open + 7, close);
  if (m.thinkSecs === undefined) m.thinkSecs = (performance.now() - t0) / 1000;
  m.answer = raw.slice(close + 8).replace(/^\s+/, "");
}

function send(text) {
  const thinking = think.getAttribute("aria-pressed") === "true";
  // `sent` is what the model reads; resending exactly that keeps the server's cache of the conversation valid
  chat.messages.push({ role: "user", content: text, think: thinking, sent: thinking || !canThink || !noThinkTag ? text : text + " /no_think" });
  if (!chats.includes(chat)) { chat.title = titleOf(chat.messages); chats.push(chat); }
  chat.at = Date.now();
  ask(thinking);
}
// the last reply again, from the same question
function retry() {
  if (busy) return;
  const msgs = chat.messages;
  if (msgs.at(-1)?.role === "assistant") msgs.pop();
  if (msgs.at(-1)?.role === "user") ask(msgs.at(-1).think ?? !(msgs.at(-1).sent ?? "").endsWith(" /no_think"));
}

async function ask(thinking) {
  clearTimeout(settle);
  const c = chat, reply = { role: "assistant", content: "", model };
  c.messages.push(reply);
  busy = new AbortController();
  setBusy(true);
  mood("thinking", "Reading");
  save(); renderChats(); renderAll();
  const el = log.lastElementChild;

  // earlier replies go back without their thinking (as Qwen3 expects), with their mood tags and any tool rounds
  const history = c.messages.slice(0, -1).flatMap((m) => [...expand(m), { role: m.role, content: m.sent ?? m.content }]);
  const useTools = $("tools").checked;
  const sys = [$("system").value.trim(), aboutModel(about), useTools ? toolPrompt() : "", $("moods").checked ? MOOD_PROMPT : ""].filter(Boolean).join("\n\n");
  if (sys) history.unshift({ role: "system", content: sys });
  const tools = useTools ? toolList() : [];
  reply.cp = `${c.id}-${Date.now()}`; // groups this reply's file changes for undo

  const t0 = performance.now();
  let raw = "", firstAt = null, usage = null, finish = null, lastMood = null, calls = [];
  let tagChunks = 0, tagLoop = false; // small models can repeat the mood tags instead of answering
  const stamps = []; // token arrival times, for the live speed
  // until the first token: how far the server is through the prompt, and whether it is waiting on the disk
  // (a model bigger than the free RAM reads its weights from the disk as it goes)
  const progress = setInterval(async () => {
    if (firstAt !== null) return clearInterval(progress);
    try {
      const p = await (await fetch("/api/progress")).json();
      if (firstAt !== null || !p.total) return;
      const pct = `${Math.min(99, Math.floor((100 * p.done) / p.total))}%`;
      if (p.disk) mood("thinking", `Loading weights from disk, ${pct}`);
      else if (p.total >= 256) mood("thinking", `Reading your message, ${pct}`);
    } catch {}
  }, 600);
  // what earlier rounds of this reply said before calling a tool, shown above the final answer
  const shownBefore = () => (reply.steps || []).map((st) => st.shown).filter((t) => t.trim());
  try {
    // a round: the model answers, or calls tools; the page runs them and asks again with the results
    for (let round = 0; ; round++) {
      const body = {
        messages: [...history, ...expand(reply)], stream: true, stream_options: { include_usage: true },
        chat_template_kwargs: { enable_thinking: thinking }, // explicit, so a server started with --no-think still follows the switch
        temperature: Number($("temp").value) || 0, max_tokens: Number($("maxTokens").value) || 2048,
        ...(useTools && round < 40 ? { tools } : {}),
      };
      raw = ""; finish = null; calls = [];
      const r = await fetch("/v1/chat/completions", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal: busy.signal });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error?.message || `HTTP ${r.status}`);
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const ev = buf.slice(0, i); buf = buf.slice(i + 2);
          if (!ev.startsWith("data: ")) continue;
          const data = ev.slice(6);
          if (data === "[DONE]") continue;
          const ch0 = JSON.parse(data);
          if (ch0.error) throw new Error(ch0.error.message);
          if (ch0.usage) usage = ch0.usage;
          const ch = ch0.choices && ch0.choices[0];
          if (!ch) continue;
          if (ch.finish_reason) finish = ch.finish_reason;
          const delta = ch.delta || {};
          if (delta.tool_calls) { // the model is calling a tool: hold up the magnifier while it does
            for (const tc of delta.tool_calls) {
              const at = tc.index ?? calls.length;
              const cl = (calls[at] ||= { id: "", name: "", arguments: "" });
              if (tc.id) cl.id = tc.id;
              if (tc.function?.name) cl.name = tc.function.name;
              if (tc.function?.arguments) cl.arguments += tc.function.arguments;
            }
            const name = calls.at(-1)?.name;
            mood("tool", TOOL_STATUS[name] || `Using ${name || "a tool"}`);
            continue;
          }
          if (!delta.content) continue;
          const now = performance.now();
          if (firstAt === null) firstAt = now;
          stamps.push(now);
          while (stamps.length && now - stamps[0] > 1000) stamps.shift();
          const rate = stamps.length > 1 ? (stamps.length - 1) / ((now - stamps[0]) / 1000) : 0;
          ghost?.rate(rate);
          $("speed").textContent = rate ? `${rate.toFixed(0)} tok/s` : "";
          raw += delta.content;
          split(raw, reply, t0);
          if (reply.think !== undefined && reply.thinkSecs === undefined) mood("thinking"); // reasoning before the answer
          else {
            const { shown, last } = moodOf(reply.answer || "", true);
            if (last) lastMood = last;
            reply.content = [...shownBefore(), shown].join("\n\n");
            speakFrom(reply, c.id, false);
            if (shown.trim()) { ghost?.token(); mood(talkingFace(lastMood), "Writing"); }
            else if (lastMood && ++tagChunks > 48) { tagLoop = true; busy.abort(); }
          }
          draw(el, reply);
        }
      }
      calls = calls.filter(Boolean);
      if (finish !== "tool_calls" || !calls.length) break;
      // run the calls, keep the round (what the model wrote, what it asked, what came back), and go again
      for (const cl of calls) {
        // the same call a third time in one reply: a small model going round in circles
        const same = (reply.steps || []).flatMap((st) => st.calls).filter((p) => p.name === cl.name && p.arguments === cl.arguments).length;
        if (same >= 2) {
          cl.result = "You already made this exact call twice; its result is above. Do something different, or answer with what you have.";
          continue;
        }
        const group = NEEDS_OK[cl.name];
        if (group && !allowed[group]) {
          mood("curious", "Waiting for your OK");
          const v = await approve(el, cl, group);
          if (v === "deny") {
            cl.denied = true;
            cl.result = "The user declined this action. Do not try it again. If there is no other way to proceed, explain the situation clearly and stop.";
            continue;
          }
          if (v === "always") { allowed[group] = true; store.set("allow", allowed); }
        }
        mood("tool", TOOL_STATUS[cl.name] || `Using ${cl.name}`);
        cl.result = await runTool(cl.name, cl.arguments, reply.cp);
        if (group === "edit" && !cl.result.startsWith("Error")) reply.changed = true;
      }
      const { shown } = moodOf(reply.answer || "", false);
      (reply.steps ||= []).push({ sent: reply.answer || "", shown, calls });
      reply.think = undefined; reply.thinkSecs = undefined; reply.answer = "";
      draw(el, reply);
      mood("thinking", "Reading the results");
    }
    const { shown } = moodOf(reply.answer || "", false);
    reply.content = [...shownBefore(), shown].join("\n\n");
    speakFrom(reply, c.id, true);
    delete reply.said;
    reply.sent = reply.answer || ""; // with its tags, as the model wrote it
    const secs = (performance.now() - (firstAt ?? t0)) / 1000;
    if (usage) {
      const rate = usage.completion_tokens / Math.max(secs, 1e-3);
      reply.meta = `${usage.completion_tokens} tokens in ${secs.toFixed(1)} s, ${rate.toFixed(1)} tok/s, first token after ${((firstAt ?? t0) - t0).toFixed(0)} ms` + (finish === "length" ? ", stopped at the length limit" : "");
    }
    settleTo(afterFace(lastMood), lastMood && !["happy", "neutral"].includes(lastMood) ? 5000 : 2200);
  } catch (e) {
    if (tagLoop) {
      reply.content = "";
      reply.error = "This model kept repeating the ghost's mood tags instead of answering. Turn off \"Let the model set the ghost's mood\" in Reply settings, then try again.";
      settleTo("confused", 8000, "Stuck on mood tags", true);
    } else if (e.name === "AbortError") { reply.meta = "stopped"; settleTo("idle", 10); }
    else {
      // a network failure (the browser only says "Failed to fetch"): say what it means
      reply.error = e instanceof TypeError ? "Can't reach the server. Check that ghost-infer serve is still running, then try again." : String(e.message || e);
      settleTo("confused", 5000, "Couldn't answer", true);
    }
  } finally {
    clearInterval(progress);
    if (reply.think !== undefined && reply.thinkSecs === undefined) reply.thinkSecs = (performance.now() - t0) / 1000;
    busy = null;
    ghost?.rate(0);
    $("speed").textContent = "";
    setBusy(false);
    save();
    draw(el, reply, true);
  }
}

function setBusy(on) {
  const b = $("sendBtn");
  b.classList.toggle("stop", on);
  b.setAttribute("aria-label", on ? "Stop the reply" : "Send");
  $("sendIcon").innerHTML = on ? '<rect x="4.5" y="4.5" width="9" height="9" rx="2" fill="currentColor"/>'
                               : '<path d="M9 14V4M4.5 8.5 9 4l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  canSend();
}
const input = $("input");
const canSend = () => { $("sendBtn").disabled = !busy && (!input.value.trim() || !!loadingModel); };
const grow = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight + 2, innerHeight * 0.4) + "px"; };
function typed() {
  grow(); canSend();
  if (busy) return;
  clearTimeout(settle);
  mood(input.value.trim() ? "listening" : "idle");
}
input.addEventListener("input", typed);
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); } });
$("form").onsubmit = (e) => {
  e.preventDefault();
  speaker.stop(); // a stopped reply, or a new message: the voice stops too
  if (busy) { busy.abort(); return; }
  const text = input.value.trim();
  if (!text) return;
  if ($("speak").checked && speechModel) speaker.unlock();
  input.value = "";
  grow(); canSend();
  send(text);
};

renderChats();
renderAll();
// ?mood=shocked holds that face, to preview it; otherwise a wave hello
const preview = new URLSearchParams(location.search).get("mood");
if (preview) mood(preview, preview);
else settleTo("wave", 2400);
input.focus();
</script>
</body>
</html>
